name: EpocheShell
options:
  bundleIdPrefix: com.osmanevski
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2Y8L4BFX79
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
targets:
  Epoche:
    type: application
    platform: iOS
    sources: [Epoche, Ortak]
    # Widget kimliği bu ortak anahtarlık grubundan okur (İkarus kalıbı; App Group yok).
    entitlements:
      path: Epoche/Epoche.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.osmanevski.epoche.paylasim
    dependencies:
      - target: EpocheWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmanevski.epoche
        PRODUCT_NAME: Epoche
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Epoche
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Epoche'ye fotoğraf eklemek için"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Epoche'ye görsel eklemek için"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Epoche'de ses kaydı için"
  EpocheWidget:
    type: app-extension
    platform: iOS
    sources: [EpocheWidget, Ortak]
    # Widget kimliği bu ortak anahtarlık grubundan okur (İkarus kalıbı; App Group yok).
    entitlements:
      path: EpocheWidget/EpocheWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.osmanevski.epoche.paylasim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osmanevski.epoche.widget
        PRODUCT_NAME: EpocheWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Epoche
        SKIP_INSTALL: YES
    info:
      path: EpocheWidget/Info.plist
      properties:
        CFBundleDisplayName: Epoche
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
