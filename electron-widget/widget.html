<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epoche Widget</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: rgba(245, 240, 232, 0.92);
    --surface: rgba(255, 255, 255, 0.7);
    --border: rgba(44, 37, 24, 0.08);
    --text: #1A1714;
    --text-secondary: #6B6152;
    --text-muted: #A89E8C;
    --gold: #C8A951;
    --tag-work: #3B82F6;
    --tag-personal: #8B5CF6;
    --tag-project: #10B981;
    --tag-meeting: #F59E0B;
    /* Günün rengi — JS tarafından güncellenir */
    --day-accent: #C8A951;
    --day-accent-soft: rgba(200, 169, 81, 0.14);
  }


  body {
    font-family: -apple-system, 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    border-radius: 14px;
    overflow: hidden;
    -webkit-app-region: drag;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid var(--border);
  }

  .header {
    padding: 14px 16px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .header:hover {
    opacity: 0.8;
  }

  .header {
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .header h1 {
    font-size: 11px;
    font-weight: 600;
    color: var(--day-accent);
    letter-spacing: -0.2px;
    transition: color 0.4s ease;
  }

  .header .open-icon {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }

  .header:hover .open-icon {
    transform: translateX(2px);
  }

  .date-hero {
    margin: 4px 12px 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--day-accent-soft);
    border-left: 3px solid var(--day-accent);
    -webkit-app-region: drag;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .date-hero .day-number {
    font-size: 36px;
    font-weight: 700;
    color: var(--day-accent);
    line-height: 1;
    letter-spacing: -1px;
    transition: color 0.4s ease;
  }

  .date-hero .day-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-top: 2px;
  }

  .date-hero .month-year {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .section {
    padding: 4px 12px 8px;
  }

  .section-title {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 6px;
    padding: 0 4px;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  .card .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card .info {
    flex: 1;
    min-width: 0;
  }

  .card .title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card .meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .empty {
    text-align: center;
    padding: 16px 0;
    font-size: 11px;
    color: var(--text-muted);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 16px;
  }

  .task-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  .task-card .checkbox {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1.5px solid var(--text-muted);
    flex-shrink: 0;
  }

  .task-card .title {
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .task-card .task-date {
    font-size: 9px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="header" id="open-app">
  <h1>Epoche</h1>
  <span class="open-icon">&#x2197;</span>
</div>

<div class="date-hero">
  <div class="day-number" id="day-number"></div>
  <div class="day-name" id="day-name"></div>
  <div class="month-year" id="month-year"></div>
</div>

<div class="section">
  <div class="section-title">Bugünün Etkinlikleri</div>
  <div id="events-container">
    <div class="empty">Yükleniyor...</div>
  </div>
</div>

<div class="divider"></div>

<div class="section">
  <div class="section-title">Yaklaşan Görevler</div>
  <div id="tasks-container">
    <div class="empty">Yükleniyor...</div>
  </div>
</div>

<script>
  const TAG_COLORS = {
    work: "#3B82F6",
    personal: "#8B5CF6",
    project: "#10B981",
    meeting: "#F59E0B",
  };

  const MONTHS_TR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  const DAYS_TR = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

  // Haftanın her günü için ayrı renk — index = Date.getDay() (0 = Pazar)
  const DAY_COLORS = [
    "#C8A951", // Pazar     — altın
    "#E2725B", // Pazartesi — kiremit
    "#E0A458", // Salı      — kehribar
    "#6FA287", // Çarşamba  — adaçayı yeşili
    "#5B8AA6", // Perşembe  — tozlu mavi
    "#9B7EBD", // Cuma      — mor
    "#C97B84", // Cumartesi — gül
  ];

  // hex -> rgba (yumuşak arka plan için)
  function hexToSoft(hex, alpha) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function applyDayColor(dayIndex) {
    const color = DAY_COLORS[dayIndex] || DAY_COLORS[0];
    const root = document.documentElement.style;
    root.setProperty("--day-accent", color);
    root.setProperty("--day-accent-soft", hexToSoft(color, 0.14));
  }

  function getToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDateShort(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.getDate() + " " + MONTHS_TR[d.getMonth()];
  }

  // Tarih hero — her veri güncellemesinde ve periyodik olarak güncelle
  function updateDateHero() {
    const now = new Date();
    applyDayColor(now.getDay());
    document.getElementById("day-number").textContent = now.getDate();
    document.getElementById("day-name").textContent = DAYS_TR[now.getDay()];
    document.getElementById("month-year").textContent = MONTHS_TR[now.getMonth()] + " " + now.getFullYear();
  }
  updateDateHero();
  setInterval(updateDateHero, 60000);

  // Widget'a tıklayınca uygulamayı aç
  document.getElementById("open-app").addEventListener("click", () => {
    if (window.widgetAPI && window.widgetAPI.openApp) {
      window.widgetAPI.openApp();
    }
  });

  function renderEvents(events) {
    const container = document.getElementById("events-container");
    const today = getToday();
    const todayEvents = events
      .filter(e => e.date === today && (e.recurrence === "none" || !e.recurrence))
      .sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));

    if (todayEvents.length === 0) {
      container.innerHTML = '<div class="empty">Bugün etkinlik yok</div>';
      return;
    }

    container.innerHTML = todayEvents.slice(0, 5).map(e => `
      <div class="card">
        <div class="dot" style="background: ${TAG_COLORS[e.tagColor] || TAG_COLORS.work}"></div>
        <div class="info">
          <div class="title">${esc(e.title)}</div>
          <div class="meta">${e.isAllDay ? "Tüm gün" : ((e.startTime || "") + (e.endTime ? " - " + e.endTime : ""))}</div>
        </div>
      </div>
    `).join("");
  }

  function renderTasks(tasks) {
    const container = document.getElementById("tasks-container");
    const today = getToday();
    const upcoming = tasks
      .filter(t => t.status !== "done" && t.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date))
      .slice(0, 5);

    if (upcoming.length === 0) {
      container.innerHTML = '<div class="empty">Yaklaşan görev yok</div>';
      return;
    }

    container.innerHTML = upcoming.map(t => `
      <div class="task-card">
        <div class="checkbox"></div>
        <div class="title">${esc(t.title)}</div>
        <span class="task-date">${t.date === today ? "Bugün" : formatDateShort(t.date)}</span>
      </div>
    `).join("");
  }

  function esc(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // Header'a tıklayınca ana uygulamayı aç
  document.getElementById("open-app").addEventListener("click", () => {
    if (window.widgetAPI && window.widgetAPI.openApp) {
      window.widgetAPI.openApp();
    }
  });

  // IPC ile veri al
  if (window.widgetAPI) {
    window.widgetAPI.onData((raw) => {
      try {
        const data = JSON.parse(raw);
        renderEvents(data.events || []);
        renderTasks(data.tasks || []);
      } catch (e) {}
    });
  }
</script>
</body>
</html>
